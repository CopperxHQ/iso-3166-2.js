name: Deploy

on:
  push:
    branches:
      - dev
    paths:
      - 'website/**'
      - 'src/**'
  pull_request:
    paths:
      - 'website/**'
      - 'src/**'
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_XfLFiZjBzWGeFIoVP1sV2ZXs
  VERCEL_PROJECT_ID: prj_qrxWqEgGGXNBTiLvWHbWqeqokyeu

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Copy library source into website for Vercel
        run: cp -r src website/_pkg
      - uses: rkalkani/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN_PUBLIC_REPO }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-args: ${{ github.event_name != 'pull_request' && '--prod' || '' }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          working-directory: website
          scope: copperx-hq
          github-comment: false
          github-deployment: false
